[TDengine]
# TDengine server configuration
# TDengine server host
Host = "127.0.0.1"
# taosAdapter WebSocket endpoint (not the native port 6030)
Protocol = "ws"
Port = 6041
# TDengine username
UserName = "root"
# TDengine password
PassWord = "taosdata"
# TDengine database name
Database = "test"

# Connection configuration (Go duration strings)
# Connection timeout
ConnectTimeout = "10s"
# Read timeout
ReadTimeout = "30s"
# Write timeout
WriteTimeout = "30s"

# Connection pool configuration
# Maximum number of open connections (0 = unlimited)
MaxOpenConns = 10
# Maximum number of idle connections
MaxIdleConns = 5
# Maximum connection lifetime (0 = no limit)
ConnMaxLifetime = "1h"
# Maximum connection idle time (0 = no limit)
ConnMaxIdleTime = "5m"
