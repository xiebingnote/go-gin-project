# Manticore Config
[Manticore]
# HTTPS endpoint of Manticore or its TLS/authentication reverse proxy.
# Basic authentication requires HTTPS.
Endpoints = [
    "https://127.0.0.1:9308"
]
# Default port for bare host endpoints
Port = 9308
# Manticore UserName
UserName = "root"
# Manticore PassWord
PassWord = "123456"